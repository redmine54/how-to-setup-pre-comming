# my-tomcat-app/.gitlab-ci.yml (lint stage部分の抜粋)
#
# ローカルのpre-commitと同じ .pre-commit-config.yaml を参照することで、
# ローカル/CIでルールが完全に一致する。

stages:
  - lint
  - build
  - test
  # ...(以降は環境区分A~E向けdeploy等、既存の設計を継続)

lint:
  stage: lint
  image: maven:3.9-eclipse-temurin-17
  before_script:
    - apt-get update && apt-get install -y python3-pip
    - pip3 install --break-system-packages pre-commit
    # gitleaksバイナリをインストール(gitleaks-commonフックの実行に必要)
    - curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | tar -xz -C /usr/local/bin gitleaks
  script:
    - pre-commit run --all-files
  # dependency-check-javaはNVDデータベースを都度ダウンロードすると時間がかかるため、
  # ~/.m2/repository/org/owasp 配下をキャッシュしておくことを推奨する
  cache:
    key: owasp-dependency-check-cache
    paths:
      - ~/.m2/repository/org/owasp
